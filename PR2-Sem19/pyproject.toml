[tool.poetry]
name = "transcription"
version = "0.1.0"
description = "Transcription Service with FastAPI"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
youtube-transcript-api = "^1.2.3"
slowapi = "^0.1.9"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
yt-dlp = "^2026.8.19"
# transformers and torch removed - using Runpod API instead of local Whisper
ffmpeg-python = "^0.2.0"
langdetect = "^1.0.9"
redis = "^5.0.1"
asyncpg = "^0.29.0"
cachetools = "^5.3.0"
httpx = "^0.25.0"
aiofiles = "^23.2.1"
boto3 = "^1.34.0"
rq = "^1.15.1"
structlog = "^24.1.0"
prometheus-client = "^0.19.0"
stripe = "^10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.1"
pytest-xdist = "^3.5.0"
httpx = "^0.25.0"
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.0"
types-cachetools = "^5.3.0"
types-aiofiles = "^23.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Performance optimizations
addopts = [
    "--strict-markers",
    "--disable-warnings",
    "-ra",  # Show short test summary info
    "--tb=short",  # Short traceback format
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
# Cache directory for pytest cache
cache_dir = ".pytest_cache"
# Parallel execution (use -n auto to auto-detect CPU count)
# Run with: pytest -n auto

