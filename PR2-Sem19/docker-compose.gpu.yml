# GPU-accelerated docker-compose configuration
# Requires: NVIDIA GPU, nvidia-docker, and CUDA drivers
# Usage: docker-compose -f docker-compose.gpu.yml up

version: '3.8'

services:
  # Redis service for job storage
  redis:
    image: redis:7-alpine
    container_name: transcription-redis-gpu
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only for security
    volumes:
      - redis-data-gpu:/data
    env_file:
      - .env
    command:
      - sh
      - -c
      - "if [ -z \"$$REDIS_PASSWORD\" ]; then echo 'ERROR: REDIS_PASSWORD must be set in .env file'; exit 1; fi; redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""
    restart: unless-stopped
    healthcheck:
      # Healthcheck with password from .env (available in container via env_file)
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcription-network-gpu

  # Redis UI for viewing and managing Redis data
  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: transcription-redis-ui-gpu
    hostname: redis-commander
    env_file:
      - .env
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
      - HTTP_USER=${REDIS_UI_USER}
      - HTTP_PASSWORD=${REDIS_UI_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - transcription-network-gpu
    restart: unless-stopped

  # MinIO - S3-compatible object storage for local testing
  minio:
    image: minio/minio:latest
    container_name: transcription-minio-gpu
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data-gpu:/data
    command: server /data --console-address ":9001"
    networks:
      - transcription-network-gpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  # Prometheus - Metrics collection and monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: transcription-prometheus-gpu
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-gpu:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - transcription-network-gpu
    restart: unless-stopped
    depends_on:
      - transcription-api-gpu

  # Grafana - Metrics visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: transcription-grafana-gpu
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data-gpu:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - transcription-network-gpu
    restart: unless-stopped
    depends_on:
      - prometheus

  transcription-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: transcription-api-gpu
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CUDA_VISIBLE_DEVICES=0  # GPU device selection (not in .env)
    volumes:
      - ./logs:/app/logs
      - whisper-models-gpu:/app/models/whisper
      - ./temp_audio:/app/temp_audio
      - ./temp_store:/app/temp_store
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - transcription-network-gpu
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 2h
      timeout: 10s
      retries: 3
      start_period: 60s  # GPU models take longer to load

networks:
  transcription-network-gpu:
    driver: bridge

volumes:
  redis-data-gpu:
  whisper-models-gpu:
  minio-data-gpu:
  prometheus-data-gpu:
  grafana-data-gpu: